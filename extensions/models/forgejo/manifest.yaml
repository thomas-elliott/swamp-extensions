manifestVersion: 1
name: "@thomas/forgejo"
version: 2026.09.04.2
description: >-
  Administration of a Forgejo (or Gitea) server over its /api/v1 REST API,
  authenticated with a scoped access token. Find or create organizations and
  repositories and update their settings; run GitHub pull-mirrors (create via
  /repos/migrate, reconcile interval/visibility, queue immediate syncs); audit
  every mirror's sync health; manage pull requests (open, inspect mergeability
  and head CI state, merge); and audit or repoint repository webhooks so a hook
  pointing at an old CI target is reported. Changes are find-or-create or
  reversible (archive/unarchive), except the guarded pr_merge. There are no
  delete methods: an empty repository left by a failed migration is reported,
  not deleted. Secrets are never output: mirror source credentials are
  write-only, and webhook operations neither read nor write the hook secret.
repository: https://github.com/thomas-elliott/swamp-extensions
paths:
  base: manifest
models:
  - forgejo.ts
workflows: []
vaults: []
drivers: []
datastores: []
reports: []
skills: []
additionalFiles:
  - README.md
  - LICENSE.txt
labels:
  - forgejo
  - gitea
  - git
  - mirrors
  - provisioning
  - admin
dependencies: []
