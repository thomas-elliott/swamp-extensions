manifestVersion: 1
name: "@thomas/postgres-admin"
version: 2026.06.01.1
description: >-
  Non-destructive PostgreSQL administration over a direct TCP connection
  (node-postgres). Reads databases, roles, permissions, tables, connections, and
  extensions. Runs admin DDL that does not touch data: create database/role,
  grant/revoke, rotate passwords, and an idempotent app_provision method that
  combines them. Never reads or writes table rows, never runs DROP or TRUNCATE,
  and does not accept arbitrary SQL.
repository: https://github.com/thomas-elliott/swamp-extensions
