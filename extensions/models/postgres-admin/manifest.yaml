manifestVersion: 1
name: "@thomas/postgres-admin"
version: 2026.06.01.1
description: >-
  Non-destructive PostgreSQL administration over a direct TCP connection
  (node-postgres). Read/audit of databases, roles, permissions, tables,
  connections, and extensions; plus data-safe admin DDL — create database/role,
  grant/revoke, rotate passwords, and an idempotent app_provision composite.
  Never reads or writes table rows; never DROP/TRUNCATE; no arbitrary-SQL passthrough.
