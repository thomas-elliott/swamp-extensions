manifestVersion: 1
name: "@thomas/zitadel"
version: 2026.06.24.1
description: >-
  Non-destructive administration of a Zitadel instance over its Management API
  (v1 REST), authenticated with a JWT private-key service account. Reads orgs,
  projects, applications, users and managers. Creates OIDC/API applications and
  machine (service) users (idempotent); manages project roles and user grants,
  including the role-assertion flag that puts roles in tokens; rotates client
  secrets, PATs, machine keys and secrets; and deactivates or reactivates
  objects. Machine identities only. The only hard delete is a single project-role
  removal that verifies the role first (roles cannot be deactivated). Secrets are
  output once and marked sensitive.
repository: https://github.com/thomas-elliott/swamp-extensions
