manifestVersion: 1
name: "@thomas/garage"
version: 2026.06.24.1
description: >-
  Control-plane administration of a Garage (S3-compatible object store) cluster
  through its Admin API v2 (bearer token). Reads cluster health, buckets, access
  keys, and the full key×bucket permission matrix. Creates, updates and deletes
  buckets; manages aliases; creates, imports, updates, rotates and deletes access
  keys; and grants or revokes read/write/owner permissions. Never touches S3
  object data; delete and revoke methods verify the target by id first.
repository: https://github.com/thomas-elliott/swamp-extensions
