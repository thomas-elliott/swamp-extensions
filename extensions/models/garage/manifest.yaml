manifestVersion: 1
name: "@thomas/garage"
version: 2026.06.01.1
description: >-
  Control-plane administration of a Garage (S3-compatible object store) cluster
  via its Admin API v2 (bearer token). Read/audit of cluster health, buckets,
  access keys, and the full key×bucket permission matrix; plus management — create
  /update/delete buckets, manage aliases, create/import/update/rotate/delete access
  keys, and grant/revoke read/write/owner permissions. Never touches S3 object
  data; destructive verbs verify the target by id first.
repository: https://github.com/thomas-elliott/swamp-extensions
