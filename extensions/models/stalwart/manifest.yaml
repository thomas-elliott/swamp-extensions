manifestVersion: 1
name: "@thomas/stalwart"
version: 2026.06.24.1
description: >-
  Non-destructive administration of a Stalwart mail server (v0.16+) over its
  JMAP-over-HTTP management API, authenticated with a scoped admin API key.
  Reads domains, accounts, aliases, groups, DMARC/TLS reports, the outbound
  queue and server health. Creates or updates accounts and aliases, groups,
  mailing lists and roles (idempotent); changes server settings; installs and
  reloads certificates; reloads config; and deactivates or reactivates domains
  and accounts. No hard deletes: the reversible set-state methods are the only
  way to disable anything. Secrets (account passwords, certificate keys) are
  sent once and never read back.
repository: https://github.com/thomas-elliott/swamp-extensions
paths:
  base: manifest
models:
  - stalwart.ts
workflows: []
vaults: []
drivers: []
datastores: []
reports: []
skills: []
additionalFiles:
